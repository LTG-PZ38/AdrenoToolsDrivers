name: 构建 Mesa
on:
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的版本号'
        required: true
        type: string
jobs:
  start_building_turnip:
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装编译环境
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt install -y build-essential flex bison glslang-tools meson
      - name: 执行编译脚本
        run: bash ./turnip_builder_upstream.sh
      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: mesa26-turnip-v${{ inputs.version }}
          path: |
            /tmp/mesa-turnip-main-V${{ inputs.version }}.zip
